# Polly SMK-37: builds the firmware (SMK-37 Pro and FM-1), checks that the FM-1 image is unchanged by the
# screen-name work (byte for byte against the base branch), runs the tests, and shoots the SMK-37 screens.
name: smk37

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      JIELI_TOOLCHAIN: ${{ github.workspace }}/../jieli/toolchain
      AC79_SDK: ${{ github.workspace }}/../fw-AC79_AIoT_SDK
      BASE_REF: origin/smk37
      # the host code is written on macOS: glibc's -std=c99 hides clock_gettime and M_PI without this
      CC: clang -D_DEFAULT_SOURCE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libraqm0 libfribidi0 libharfbuzz0b >/dev/null
          python3 -m pip install --quiet --break-system-packages Pillow mido
          python3 -c "from PIL import features; print('raqm:', features.check('raqm'))"

      - name: Cache toolchain
        id: tc
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../jieli
          key: jieli-linux-toolchain-v1

      - name: JieLi toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        run: sh tools/get_toolchain.sh "$GITHUB_WORKSPACE/../jieli"

      - name: AC79 SDK (the three files the package uses)
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$AC79_SDK"
          git -C "$AC79_SDK" sparse-checkout set cpu/wl82/tools
          ls -la "$AC79_SDK/cpu/wl82/tools/uboot.boot" "$AC79_SDK/cpu/wl82/tools/cfg_tool.bin"

      - name: FM-1 build of the base branch (reference)
        run: |
          git worktree add ../base "$BASE_REF"
          (cd ../base && ./build.sh)
          cp ../base/build/polly.bin ../polly-fm1-base.bin

      - name: FM-1 build
        run: ./build.sh

      - name: FM-1 image against the base branch (the theme changes it on purpose)
        run: |
          if cmp -s build/polly.bin ../polly-fm1-base.bin; then
            echo "FM-1 polly.bin identical to $BASE_REF"
          else
            echo "::notice::the FM-1 image differs from $BASE_REF ($(stat -c %s ../polly-fm1-base.bin) -> $(stat -c %s build/polly.bin) bytes)"
          fi

      - name: Tests (FM-1 and SMK-37 simulator)
        continue-on-error: true
        run: sh tests/run_tests.sh

      - name: SMK-37 scenarios' failures (the lines that failed, from their logs)
        if: always()
        run: |
          for f in build/host/scenario-smk37-*.log; do
            [ -f "$f" ] || continue
            if grep -q 'FAIL' "$f"; then echo "== $f"; grep -n -i 'fail\|expect' "$f" | head -40; fi
          done

      - name: SMK-37 Pro build
        run: |
          mkdir -p dist && cp build/polly.fwsc dist/polly-fm1.fwsc
          BOARD=smk37 ./build.sh
          cp build/polly-smk37.fwsc dist/ && ls -la dist

      - name: SMK-37 screens (every page, help card and list, in the SMK-37 simulator)
        if: always()
        run: |
          [ -x build/host/polly_host_smk37 ] || sh host/build_host.sh smk37
          cp build/host/polly_host_smk37 ../host_light
          CC="$CC -DPOLLY_THEME_DEFAULT=1" sh host/build_host.sh smk37
          cp build/host/polly_host_smk37 ../host_dark
          CC="$CC -DPOLLY_THEME_DEFAULT=2" sh host/build_host.sh smk37
          cp build/host/polly_host_smk37 ../host_neon
          cp ../host_light build/host/polly_host_smk37
          mkdir -p ../smk-scripts
          fail=0
          for theme in light dark neon; do
            for s in screens cards pages lists encoders first home; do
              [ -f tests/scenarios/$s.polly ] || continue
              # the FM-1 scripts' expects check FM-1 words; the shots and the simulator's own layout checks
              # (a card's words past its box, columns over each other) stay
              grep -v '^expect' tests/scenarios/$s.polly > ../smk-scripts/$s.polly
              d=build/smk-screens/$theme/$s
              mkdir -p $d
              ../host_$theme ../smk-scripts/$s.polly $d > $d/log.txt 2>&1 \
                || { echo "::warning::$theme $s: $(grep -m1 FAIL $d/log.txt)"; fail=1; }
              grep FAIL $d/log.txt || true
            done
          done
          # Free play's screens in the dark and neon themes too (light: the tests' own run, copied below)
          for theme in dark neon; do
            d=build/smk-screens/$theme/smk37-free
            mkdir -p $d
            ../host_$theme tests/scenarios/smk37/free.polly $d > $d/log.txt 2>&1 \
              || { echo "::warning::$theme smk37-free: $(grep -m1 FAIL $d/log.txt)"; fail=1; }
          done
          cp -r build/scenarios/smk37-* build/smk-screens/light/ 2>/dev/null || true
          exit $fail

      - uses: mymindstorm/setup-emsdk@v14
        if: always()
        with:
          version: 3.1.64

      - name: SMK-37 emulator (the browser page, web/emu/smk37.html)
        if: always()
        run: |
          BOARD=smk37 sh web/emu/build.sh
          ls -la build/emu-smk37

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smk37-emulator
          path: build/emu-smk37/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polly-smk37-firmware
          path: dist/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smk37-screens
          path: build/smk-screens/
          if-no-files-found: warn
